version: "3.2"
services:
  devel:
    container_name: "labyrinth_devel"
    environment:
      COMPOSE_CONVERT_WINDOWS_PATHS: 1
      CHOKIDAR_USEPOLLING: "true"
      TESTBED: 1

    build: ./frontend
    ports:
      - "8001:8000"
      - "8002:8080"
    networks:
      - labyrinth
    volumes:
      - ./frontend:/src
      - /src/labyrinth/node_modules

  backend:
    build: "backend"
    depends_on:
      - mongo
      - postgres
      - redis
    ports:
      - "7000:7000"
    volumes:
      - ./backend/:/src
      - ./alertmanager:/alertmanager
      - ./frontend/labyrinth/public:/public
    networks:
      - labyrinth
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: labyrinth
      MONGO_USERNAME: root
      MONGO_PASSWORD: temp
      MONGO_HOST: mongo
      REDIS_HOST: redis
      TESTBED: 1

  # Caddy frontend server
  frontend:
    build: ./caddy
    restart: always
    depends_on:
      - backend
      - alertmanager
    networks:
      - labyrinth
    volumes:
      - ./caddy/Caddyfile.development:/etc/caddy/Caddyfile:ro
      # Caddy stores runtime state below the XDG homes at /data/caddy and /config/caddy.
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
      - ./frontend/labyrinth/dist/:/dist:ro
    environment:
      COMPOSE_CONVERT_WINDOWS_PATHS: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
    ports:
      - "7210:443"

  # Mongo
  mongo:
    image: mongo
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - labyrinth
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: temp

  mongo-express:
    image: mongo-express:latest
    restart: always
    networks:
      - labyrinth
    ports:
      - 8071:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: temp
      ME_CONFIG_MONGODB_URL: mongodb://root:temp@mongo:27017/

  # Postgres/TimescaleDB - the default database backend (DB_BACKEND=postgres).
  # See backend/db/ and MONGO_MIGRATION.md. Mongo above is kept running so
  # the DB_BACKEND=mongo fallback path stays testable.
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - labyrinth
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: labyrinth

  # Redis
  redis:
    image: bitnami/redis:latest
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - labyrinth
    # volumes:
    #  - ./redis_data:/bitnami/redis/data

  alertmanager:
    build: alertmanager
    networks:
      - labyrinth
    volumes:
      - ./alertmanager:/src

  # MCP Server
  mcp:
    build:
      context: .
      dockerfile: backend/ai/mcp/Dockerfile
    depends_on:
      - mongo
      - postgres
      - redis
    networks:
      - labyrinth
    volumes:
      - ./backend:/app/backend
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: labyrinth
      MONGO_USERNAME: root
      MONGO_PASSWORD: temp
      MONGO_HOST: mongo
      REDIS_HOST: redis
      MCP_PORT: 8765
      MCP_HOST: 0.0.0.0
      TESTBED: 1

  # Vulnerable server running on the network
  sampledva:
    image: vulnerables/web-dvwa
    networks:
      - labyrinth

  # Sample Finder Cron
  samplecron:
    build:
      context: .
      dockerfile: cron/Dockerfile
    depends_on:
      - mongo
      - postgres
      - redis
    volumes:
      - ./backend/:/src
      - ./cron:/cron
      - ./alertmanager:/alertmanager
      - ./backups:/backups
    networks:
      - labyrinth
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: temp
      POSTGRES_DB: labyrinth
      MONGO_USERNAME: root
      MONGO_PASSWORD: temp
      MONGO_HOST: mongo
      REDIS_HOST: redis

  # Test Client
  sampleclient:
    build: "test_client"
    networks:
      - labyrinth
    volumes:
      - ./test_client:/src
      - ./test_client/sshd_config:/etc/ssh/sshd_config

networks:
  labyrinth:
    external: true

volumes:
  caddy_data:
  caddy_config:
